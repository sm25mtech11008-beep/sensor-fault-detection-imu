[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfd"
version = "2.0.0"
description = "Fault detection for automotive IMU and thermometer channels on the PVS dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shashi Prakash" }]
keywords = ["sensor-fault-detection", "imu", "automotive", "machine-learning", "pvs"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
report = ["reportlab>=4.0", "Pillow>=10.0"]
notebooks = ["notebook>=7.0", "ipykernel>=6.0", "psutil>=5.9"]

[project.scripts]
sfd = "sfd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts must extend sys.path before importing sfd.
"experiments/*.py" = ["E402"]
# matplotlib.use() has to run before pyplot is imported.
"src/sfd/plots.py" = ["E402"]
